version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /src/*
      - /tests/*
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    reviewers:
      - kellylford
    assignees:
      - kellylford
    groups:
      # The Windows App SDK packages ship as one release; one PR rather than four. A new minor version also changes
      # the Windows App Runtime the installer carries (Microsoft.WindowsAppRuntime.1.8_*.msix), so check a release
      # build before merging one.
      windows-app-sdk:
        patterns:
          - "Microsoft.WindowsAppSDK*"
      # The test stack moves together.
      test-tooling:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    reviewers:
      - kellylford
    assignees:
      - kellylford
